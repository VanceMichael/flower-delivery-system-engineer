version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: flower-delivery-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - flower-delivery-network
    environment:
      - MONGO_INITDB_DATABASE=flower-delivery

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flower-delivery-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/flower-delivery
      - JWT_SECRET=flower-delivery-secret-key-change-in-production
      - NODE_ENV=production
    depends_on:
      - mongodb
    networks:
      - flower-delivery-network
    volumes:
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flower-delivery-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - flower-delivery-network

volumes:
  mongo_data:
    driver: local
  backend_logs:
    driver: local

networks:
  flower-delivery-network:
    driver: bridge
